<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RPG Arena</title>
    
    <!-- Telegram API -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Lottie для визуальных эффектов -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.12.2/lottie.min.js"></script>

    <!-- Твой внешний файл стилей -->
    <link rel="stylesheet" href="static/style.css">

    <!-- 🚨 СИСТЕМА ОТЛОВА ОШИБОК ДЛЯ ТЕЛЕФОНА -->
    <script>
        window.onerror = function(msg, url, line) {
            alert("🚨 ОШИБКА В КОДЕ:\n" + msg + "\nСтрока: " + line);
            return false;
        };
        window.onunhandledrejection = function(event) {
            alert("🚨 ОШИБКА ЗАГРУЗКИ:\n" + event.reason);
        };
    </script>
</head>
<body>

<div id="app-container">
    <div id="blood-screen"></div>

    <!-- ВЕРХНЯЯ ПАНЕЛЬ -->
    <div class="top-bar">
        <div>💰 <span id="ui-gold">0</span> &nbsp; 💎 <span id="ui-gems">0</span></div>
        <div>УР. <span id="ui-top-lvl">1</span> | ЭТАЖ <span id="ui-top-floor">1</span></div>
        <div style="flex:1; margin: 0 10px; background:#27272a; border-radius:4px; position:relative; overflow:hidden;">
            <div id="ui-exp-bar" style="width:0%; background:#34d399; height:100%; transition: width 0.3s;"></div>
            <div id="ui-top-exp" style="position:absolute; top:0; left:0; width:100%; text-align:center; font-size:10px; line-height:14px; text-shadow:0 1px 2px #000;">0/100</div>
        </div>
    </div>

    <!-- ЭКРАНЫ ПРИЛОЖЕНИЯ -->
    <div class="app-screens-wrapper">

        <!-- ЭКРАН 1: ГЕРОЙ -->
        <div id="screen-hero" class="app-screen active">
            <div id="ui-debuff-timer" style="display:none; background:#7f1d1d; color:#fca5a5; text-align:center; padding:5px; font-size:10px; font-weight:bold; margin-bottom:10px; border-radius:4px;"></div>
            <div id="ui-class-name" style="text-align:center; font-weight:bold; font-size:16px; margin-bottom:20px; color:#d8b4fe;"></div>

            <div class="hero-layout">
                <div class="slots-column">
                    <div id="slot-head" class="equip-slot"></div>
                    <div id="slot-chest" class="equip-slot"></div>
                    <div id="slot-weapon1" class="equip-slot"></div>
                    <div id="slot-ring1" class="equip-slot"></div>
                </div>
                <div style="width:120px; height:180px; display:flex; justify-content:center; align-items:center;">
                    <img id="main-hero-avatar" src="" style="max-width:100%; max-height:100%; object-fit:contain; filter:drop-shadow(0 0 10px rgba(251,191,36,0.3));">
                </div>
                <div class="slots-column">
                    <div id="slot-amulet" class="equip-slot"></div>
                    <div id="slot-belt" class="equip-slot"></div>
                    <div id="slot-weapon2" class="equip-slot"></div>
                    <div id="slot-ring2" class="equip-slot"></div>
                </div>
            </div>
            <div style="display:flex; justify-content:center; gap:20px; margin-bottom:30px;">
                <div id="slot-boots" class="equip-slot"></div>
            </div>

            <div style="background:#18181b; padding:10px; border-radius:8px; border:1px solid #27272a; margin-bottom:20px;">
                <div style="display:flex; justify-content:space-between; font-size:10px; color:#a1a1aa; font-weight:bold; margin-bottom:8px;">
                    <span>СУМКА</span> <span id="ui-bag-capacity">0/15</span>
                </div>
                <div id="ui-inventory-grid"></div>
            </div>

            <div id="ui-stats-container"></div>
        </div>

        <!-- ЭКРАН 2: БОЙ (PVE) -->
        <div id="screen-PVE" class="app-screen">
            <div id="combat-floor-title" style="text-align:center; margin-bottom:10px;"></div>
            <div id="combat-stage-name" class="combat-header"></div>
            
            <div class="combat-dashboard"></div>

            <div id="arena-bg" style="border-radius:12px; padding:15px; position:relative; overflow:hidden; border:1px solid #3f3f46; box-shadow:0 10px 30px rgba(0,0,0,0.5);">
                <div id="combat-entities-box" style="display:flex; justify-content:space-between; align-items:flex-end; height:180px;">
                    <div id="entity-hero-box" style="width:45%; position:relative;">
                        <div id="combat-hero-name-plate" style="text-align:center; font-size:10px; font-weight:bold; margin-bottom:4px;"></div>
                        <img id="combat-hero-img" src="" style="width:100%; height:120px; object-fit:contain;">
                        <div id="hero-slash" class="slash-fx"></div>
                        <div style="background:#000; height:10px; border-radius:5px; border:1px solid #3f3f46; margin-top:5px; overflow:hidden;">
                            <div id="combat-hero-hp-bar" style="height:100%; background:#10b981; width:100%;"></div>
                        </div>
                        <div style="font-size:9px; text-align:center; margin-top:2px;">HP: <span id="combat-hero-hp">0</span>/<span id="combat-hero-maxhp">0</span></div>
                        <div style="font-size:9px; text-align:center; color:#a1a1aa;">⚔️<span id="combat-hero-atk-val">0</span> 🛡️<span id="combat-hero-arm-val">0</span></div>
                    </div>

                    <div id="clash-spark-fx" style="position:absolute; left:50%; top:50%; transform:translate(-50%, -50%);"></div>

                    <div id="entity-enemy-box" style="width:45%; position:relative;">
                        <div id="combat-enemy-name-plate" style="text-align:center; font-size:10px; font-weight:bold; margin-bottom:4px; color:#fca5a5;"></div>
                        <img id="combat-enemy-img" src="" style="width:100%; height:120px; object-fit:contain;">
                        <div id="enemy-slash" class="slash-fx"></div>
                        <div id="enemy-stun-icon" style="position:absolute; top:-20px; left:50%; transform:translateX(-50%); font-size:24px; display:none;">💫</div>
                        <div style="background:#000; height:10px; border-radius:5px; border:1px solid #3f3f46; margin-top:5px; overflow:hidden;">
                            <div id="combat-enemy-hp-bar" style="height:100%; background:#ef4444; width:100%;"></div>
                        </div>
                        <div style="font-size:9px; text-align:center; margin-top:2px;">HP: <span id="combat-enemy-hp">0</span>/<span id="combat-enemy-maxhp">0</span></div>
                        <div style="font-size:9px; text-align:center; color:#a1a1aa;">⚔️<span id="combat-enemy-atk-val">0</span> 🛡️<span id="combat-enemy-arm-val">0</span></div>
                    </div>
                </div>

                <div id="enemy-rage-bg" style="display:none; width:100%; height:4px; background:#2a0808; margin-top:10px; border-radius:2px;">
                    <div id="enemy-rage-bar" style="height:100%; background:#ef4444; width:0%;"></div>
                </div>
            </div>

            <div id="combo-display" style="text-align:center; margin:10px 0; font-weight:bold; color:#fbbf24; font-size:14px; opacity:0; transition:opacity 0.2s;"></div>
            <div id="combat-intent" style="text-align:center; margin-bottom:15px; font-size:12px; background:#18181b; padding:8px; border-radius:8px; border:1px solid #27272a;"></div>

            <div style="display:flex; justify-content:space-between; gap:10px; margin-bottom:15px;">
                <div style="flex:1;">
                    <div style="text-align:center; font-size:10px; font-weight:bold; color:#fca5a5; margin-bottom:5px;">АТАКА ⚔️</div>
                    <div style="display:flex; flex-direction:column; gap:5px;">
                        <button id="btn-atk-head" class="zone-btn atk" onclick="selectZone('atk', 'head')">ГОЛОВА</button>
                        <button id="btn-atk-chest" class="zone-btn atk" onclick="selectZone('atk', 'chest')">ТОРС</button>
                        <button id="btn-atk-legs" class="zone-btn atk" onclick="selectZone('atk', 'legs')">НОГИ</button>
                    </div>
                </div>
                <div style="flex:1;">
                    <div style="text-align:center; font-size:10px; font-weight:bold; color:#6ee7b7; margin-bottom:5px;">ЗАЩИТА 🛡️</div>
                    <div style="display:flex; flex-direction:column; gap:5px;">
                        <button id="btn-def-head" class="zone-btn def" onclick="selectZone('def', 'head')">ГОЛОВА <span id="dur-head"></span></button>
                        <button id="btn-def-chest" class="zone-btn def" onclick="selectZone('def', 'chest')">ТОРС <span id="dur-chest"></span></button>
                        <button id="btn-def-legs" class="zone-btn def" onclick="selectZone('def', 'legs')">НОГИ <span id="dur-legs"></span></button>
                    </div>
                </div>
            </div>

            <div style="display:flex; gap:10px; margin-bottom:15px;">
                <button id="btn-use-skill" style="flex:1; background:#3b0764; border:1px solid #7e22ce; color:#e9d5ff; border-radius:8px; padding:10px; font-weight:bold;" onclick="useClassSkill()">СКИЛЛ</button>
                <button id="btn-execute-turn" style="flex:2; background:#b45309; border:none; border-radius:8px; color:#fff; font-weight:bold; font-size:16px; box-shadow:0 4px 0 #78350f;" onclick="executeTurn()">ВЫБЕРИТЕ ЗОНЫ</button>
            </div>

            <div id="combat-log" style="height:120px; overflow-y:auto; background:#000; border:1px solid #27272a; border-radius:8px; padding:8px; font-size:10px; color:#a1a1aa; line-height:1.4;"></div>
        </div>

        <!-- ОСТАЛЬНЫЕ ЭКРАНЫ -->
        <div id="screen-boss" class="app-screen">
            <div style="text-align:center; margin-bottom:10px;">БИЛЕТЫ: <span id="ui-raid-tickets" style="color:#fbbf24; font-weight:bold;">0/3</span></div>
            <div id="ui-ticket-timer" style="text-align:center; font-size:10px; color:#71717a; margin-bottom:20px;"></div>
            <div id="ui-raid-list"></div>
        </div>
        
        <div id="screen-arena" class="app-screen">
            <div style="text-align:center; margin-bottom:20px;">ВАШ РЕЙТИНГ: <span id="ui-pvp-rating" style="color:#fbbf24; font-size:24px; font-weight:bold;">0</span> 🏆</div>
            <button style="width:100%; padding:15px; background:#ea580c; border:none; border-radius:12px; color:#fff; font-weight:bold; font-size:18px; margin-bottom:20px;" onclick="startPvP()">ИСКАТЬ ПРОТИВНИКА ⚔️</button>
            <div id="ui-pvp-leaderboard"></div>
        </div>

        <div id="screen-blacksmith" class="app-screen">
            <div id="ui-forge-grid"></div>
            <div id="forge-details-panel" style="display:none; margin-top:20px; background:#18181b; padding:15px; border-radius:12px; border:1px solid #3f3f46;">
                <div style="display:flex; justify-content:center; margin-bottom:15px;"><div id="forge-anvil" style="font-size:40px;">🔨</div></div>
                <div id="f-item-name" style="text-align:center; font-weight:bold; font-size:16px; margin-bottom:5px; color:#fbbf24;"></div>
                <div id="f-item-lvl" style="text-align:center; font-size:12px; color:#a1a1aa; margin-bottom:15px;"></div>
                <div id="f-item-stats" style="font-size:12px; color:#e4e4e7; line-height:1.8; margin-bottom:20px;"></div>
                <button id="btn-forge-upgrade" style="width:100%; padding:15px; background:#059669; border:none; border-radius:8px; color:#fff; font-weight:bold; font-size:16px;" onclick="upgradeItem()"></button>
            </div>
        </div>

        <div id="screen-shop" class="app-screen">
            <div style="display:flex; gap:10px; margin-bottom:20px;">
                <button style="flex:1; padding:10px; background:#27272a; border:none; color:#fff; border-radius:8px;" onclick="setShopMode('buy')">КУПИТЬ</button>
                <button style="flex:1; padding:10px; background:#27272a; border:none; color:#fff; border-radius:8px;" onclick="setShopMode('sell')">ПРОДАТЬ</button>
            </div>
            <div id="ui-shop-list"></div>
        </div>

        <div id="screen-classes" class="app-screen">
            <div id="ui-classes-gallery" style="display:flex; gap:10px; overflow-x:auto; margin-bottom:20px;"></div>
            <div id="ui-class-detail"></div>
        </div>

        <div id="screen-quests" class="app-screen">
            <div id="ui-quests-list"></div>
        </div>

        <div id="screen-talents" class="app-screen">
            <div id="ui-talents-container"></div>
        </div>

        <div id="screen-rating" class="app-screen">
            <div id="ui-global-top"></div>
        </div>
    </div>

    <!-- НИЖНЯЯ НАВИГАЦИЯ -->
    <div class="bottom-nav">
        <div id="nav-hero" class="nav-btn active" onclick="openScreen('hero')"><div style="font-size:20px; margin-bottom:4px;">🛡️</div>ГЕРОЙ</div>
        <div id="nav-talents" class="nav-btn" onclick="openScreen('talents')"><div style="font-size:20px; margin-bottom:4px;">✨</div>ТАЛАНТЫ</div>
        <div id="nav-PVE" class="nav-btn" onclick="openScreen('PVE')"><div style="font-size:20px; margin-bottom:4px;">⚔️</div>В БОЙ</div>
        <div id="nav-boss" class="nav-btn" onclick="openScreen('boss')"><div style="font-size:20px; margin-bottom:4px;">🐉</div>РЕЙДЫ</div>
        <div id="nav-arena" class="nav-btn" onclick="openScreen('arena')"><div style="font-size:20px; margin-bottom:4px;">🏆</div>АРЕНА</div>
        <div id="nav-blacksmith" class="nav-btn" onclick="openScreen('blacksmith')"><div style="font-size:20px; margin-bottom:4px;">⚒️</div>КУЗНЯ</div>
        <div id="nav-shop" class="nav-btn" onclick="openScreen('shop')"><div style="font-size:20px; margin-bottom:4px;">⛺</div>ЛАВКА</div>
        <div id="nav-classes" class="nav-btn" onclick="openScreen('classes')"><div style="font-size:20px; margin-bottom:4px;">🏛️</div>КЛАСС</div>
        <div id="nav-quests" class="nav-btn" onclick="openScreen('quests')"><div style="font-size:20px; margin-bottom:4px;">📜</div>КВЕСТЫ</div>
        <div id="nav-rating" class="nav-btn" onclick="openScreen('rating')"><div style="font-size:20px; margin-bottom:4px;">🏅</div>РЕЙТИНГ</div>
    </div>
</div>

<!-- МОДАЛКИ (Всплывающие окна) -->
<div id="vic-modal" class="modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:100; justify-content:center; align-items:center;">
    <div class="modal-content" style="background:#18181b; border:1px solid #3f3f46; border-radius:12px; padding:20px; text-align:center; width:90%; max-width:320px;">
        <h2 id="vic-title-text" style="margin-top:0; color:#fbbf24;">ПОБЕДА!</h2>
        <div id="vic-rewards-text" style="font-size:14px; margin-bottom:20px; color:#e4e4e7;"></div>
        <div id="vic-loot-container" style="display:none; flex-direction:column; align-items:center; margin-bottom:20px;">
            <div style="font-size:10px; color:#a1a1aa; margin-bottom:5px;">ДОБЫЧА:</div>
            <div id="vic-loot-box" style="width:60px; height:60px; background:#121214; border-radius:8px; display:flex; justify-content:center; align-items:center;"></div>
            <div id="vic-loot-name" style="font-size:12px; font-weight:bold; margin-top:5px; color:#d8b4fe;"></div>
        </div>
        <button style="width:100%; padding:12px; background:#fbbf24; border:none; border-radius:8px; color:#000; font-weight:bold; cursor:pointer;" onclick="closeVictoryModal()">ПРОДОЛЖИТЬ</button>
    </div>
</div>

<div id="item-inspect-modal" class="modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:100; justify-content:center; align-items:center;">
    <div class="modal-content" style="background:#09090b; border:1px solid #fbbf24; border-radius:12px; padding:20px; text-align:center; width:90%; max-width:320px;">
        <h3 id="inspect-title" style="margin-top:0; color:#fbbf24; font-size:16px;"></h3>
        <div style="display:flex; justify-content:center; margin-bottom:15px;">
            <div id="inspect-icon-box" style="width:80px; height:80px; background:#121214; border-radius:12px; display:flex; justify-content:center; align-items:center;"></div>
        </div>
        <div id="inspect-stats-box" style="background:#18181b; border-radius:8px; padding:10px; text-align:left; border:1px solid #27272a; margin-bottom:20px;"></div>
        <div style="display:flex; flex-direction:column; gap:10px;">
            <button id="btn-inspect-equip" style="width:100%; padding:15px; border:none; border-radius:8px; font-weight:bold; cursor:pointer; color:#000;"></button>
            <div style="display:flex; gap:10px;">
                <button id="btn-inspect-sell" style="flex:1; padding:12px; background:#ef4444; border:none; border-radius:8px; color:#fff; font-weight:bold; cursor:pointer;"></button>
                <button style="flex:1; padding:12px; background:#27272a; border:none; border-radius:8px; color:#fff; font-weight:bold; cursor:pointer;" onclick="closeInspectModal()">ЗАКРЫТЬ</button>
            </div>
        </div>
    </div>
</div>

<!-- ПОДКЛЮЧАЕМ ИГРОВОЙ СКРИПТ С ПРИНУДИТЕЛЬНЫМ СБРОСОМ КЭША -->
<script src="static/game.js?v=12"></script>

</body>
</html>
